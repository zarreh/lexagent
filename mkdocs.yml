site_name: LexAgent
site_description: Grounded rental-law reasoning over statute and synthetic precedent.
repo_url: https://github.com/zarreh/lexagent
edit_uri: edit/main/docs/

# Internal build-planning documents live alongside the site source in docs/ but
# are not part of the published site — see NOTICE.md for why PLAN.md stays local.
exclude_docs: |
  PLAN.md
  PLAN_REVIEW_claude-sonnet-5.md
  REVIEW_GITHUB_COPILOT.md
  REVIEW_Kimi_K2_7_Code.md
  generate_plots.py
  assets/plot_style.mplstyle
  PORTFOLIO_CARD_DRAFT.md
  WRITING_POST_DRAFT.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - glightbox
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - How it works:
      - In plain language: how-it-works/in-plain-language.md
      - The reasoning loop: how-it-works/the-reasoning-loop.md
      - Grounding: how-it-works/grounding.md
      - What it won't do: how-it-works/what-it-wont-do.md
  - Architecture:
      - Overview: architecture/overview.md
      - Data pipeline: architecture/data-pipeline.md
      - Tools: architecture/tools.md
      - State and flow: architecture/state-and-flow.md
